services:
  - type: web
    name: after-hours-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn myapp.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: myapp.settings
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "After Hours <no-reply@reply.afterhoursranked.com>"
